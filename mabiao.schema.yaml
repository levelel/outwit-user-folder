# Rime schema
# encoding: utf-8

schema:
  schema_id: mabiao
  name: 码表
  version: "1.0"
  author:
    - 几维输入法
  description: |
    码表输入方案。加载固定的码表，输入引擎查询码表内编码。

# 开关设定
switches:
  - name: ascii_mode
    reset: 0
    states: [ 中, A ]
    description: 中英文切换
  - name: full_shape
    reset: 0
    states: [ 半, 全 ]
    description: 全角半角字符切换
  - name: simplification
    reset: 0
    states: [ 简, 繁 ]
    description: 简体繁体切换
  - name: ascii_punct
    reset: 0
    states: [ 。，, ．， ]
    description: 全角半角符号切换

# 引擎: 最小化配置
engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - simplifier
    - uniquifier

# 主翻译器
translator:
  dictionary: mabiao
  enable_sentence: false
  enable_completion: false
  enable_user_dict: false
  initial_quality: 1.0
  enable_charset_filter: false
  enable_encoder: true
  encode_commit_history: false
  max_phrase_length: 1  # 只处理单字
  comment_format:
    - xform/^.+$//  # 清除注释

# 拼写设定
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  initials: abcdefghijklmnopqrstuvwxyz
  finals: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"

# 标点符号
punctuator:
  import_preset: default
  digit_separator_action: commit # 数字后默认是半角句号
  digit_separators: ""
  # # 如果默认要在数字后输出全角句号
  # half_shape:  
  #   ".": "。"  

# 识别器
recognizer:
  import_preset: default

# 键位绑定
key_binder:
  import_preset: default

# 简繁转换
simplifier:
  option_name: simplification
  opencc_config: s2t.json
